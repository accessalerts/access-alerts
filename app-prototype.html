<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Alerts — App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dawn-a: #FFE3B0; --dawn-b: #F5A623;
    --day-a: #CFEFE0; --day-b: #34C77B;
    --dusk-a: #C9CBFF; --dusk-b: #4B4FD9;
    --ink: #0C0F1A;
    --panel: #12162A;
    --glass: rgba(255,255,255,0.06);
    --glass-2: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.14);
    --text: #F3F4FA;
    --text-dim: rgba(243,244,250,0.62);
    --up: #34C77B;
    --down: #FF6B6B;
    --accent: #34C77B;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1a2140 0%, var(--ink) 55%);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 28px 14px 40px;
  }

  /* ---------- TOP LABEL ---------- */
  .lab { text-align: center; margin-bottom: 18px; }
  .lab .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
  .lab h1 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin-top: 4px; }
  .lab .note { font-size: 12px; color: var(--text-dim); margin-top: 4px; max-width: 360px; }

  /* ---------- PHONE FRAME ---------- */
  .device {
    width: 380px; max-width: 94vw; height: 780px; max-height: 84vh;
    background: linear-gradient(160deg, #171b32, #0d1022);
    border-radius: 42px; padding: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
    position: relative;
  }
  .screen {
    width: 100%; height: 100%; border-radius: 32px; overflow: hidden;
    background: linear-gradient(180deg, #0e1226, #090b18 60%);
    display: flex; flex-direction: column; position: relative;
  }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 90px; height: 18px; background: #05060d; border-radius: 12px; z-index: 20; }

  /* ---------- BANNER ---------- */
  .demo-banner {
    font-family: var(--font-mono); font-size: 9.5px; text-align: center;
    color: var(--text-dim); background: rgba(255,255,255,0.04);
    border-bottom: 1px solid var(--glass-border);
    padding: 26px 10px 6px;
    letter-spacing: 0.02em;
  }

  /* ---------- TOP BAR ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .name { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; }

  /* ---------- CONTENT ---------- */
  .content { flex: 1; overflow-y: auto; padding: 6px 16px 20px; }
  .content::-webkit-scrollbar { display: none; }
  h2.screen-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 10px 0 14px; }
  .section-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin: 18px 0 8px; }

  .glass { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 14px; backdrop-filter: blur(8px); }
  .glass + .glass { margin-top: 10px; }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; cursor: pointer; border-bottom: 1px solid var(--glass-border); }
  .row:last-child { border-bottom: none; }
  .row:active { opacity: 0.7; }
  .tick { font-weight: 700; font-size: 14px; }
  .name { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .price-block { text-align: right; }
  .price { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
  .chg { font-family: var(--font-mono); font-size: 11px; margin-top: 2px; }
  .up { color: var(--up); } .down { color: var(--down); }

  .spark { width: 60px; height: 24px; }

  /* ---------- BUTTONS / FORM ---------- */
  .field { margin-bottom: 12px; }
  .field label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px;
    padding: 11px 12px; color: var(--text); font-size: 14px; font-family: var(--font-body); outline: none;
  }
  .btn-primary { width: 100%; background: var(--accent); color: #06180F; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-ghost { width: 100%; background: transparent; color: var(--text); border: 1px solid var(--glass-border); padding: 13px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px; }
  .link { font-size: 12.5px; color: var(--text-dim); text-align: center; margin-top: 16px; cursor: pointer; }
  .link b { color: var(--accent); font-weight: 600; }

  /* ---------- CHIPS / TABS ---------- */
  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }
  .chip { font-family: var(--font-mono); font-size: 11px; padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); white-space: nowrap; cursor: pointer; }
  .chip.active { background: var(--accent); color: #06180F; border-color: var(--accent); font-weight: 600; }
  .tf-row { display: flex; gap: 6px; margin: 12px 0; }
  .tf { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 11px; padding: 7px 0; border-radius: 8px; background: var(--glass); cursor: pointer; color: var(--text-dim); }
  .tf.active { background: var(--glass-2); color: var(--text); font-weight: 600; }

  /* ---------- STOCK DETAIL ---------- */
  .detail-price { font-family: var(--font-mono); font-size: 32px; font-weight: 500; margin-top: 4px; }
  .detail-chg { font-size: 13px; margin-top: 2px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .stat { }
  .stat .k { font-size: 10px; color: var(--text-dim); }
  .stat .v { font-family: var(--font-mono); font-size: 13px; margin-top: 2px; }
  .news-item { padding: 9px 0; border-bottom: 1px solid var(--glass-border); }
  .news-item:last-child { border-bottom: none; }
  .news-item .h { font-size: 12.5px; line-height: 1.4; }
  .news-item .s { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

  /* ---------- MILO ---------- */
  .milo-msg { max-width: 84%; padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
  .milo-msg.bot { background: var(--glass); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
  .milo-msg.me { background: var(--accent); color: #06180F; margin-left: auto; border-bottom-right-radius: 4px; font-weight: 500; }
  .milo-suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .milo-suggest span { font-size: 11px; padding: 7px 11px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); cursor: pointer; }
  .milo-input-row { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--glass-border); }
  .milo-input-row input { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px; padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; }
  .milo-send { width: 38px; height: 38px; border-radius: 999px; background: var(--accent); border: none; color: #06180F; font-weight: 700; cursor: pointer; flex-shrink: 0; }

  /* ---------- SETTINGS ---------- */
  .set-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; border-bottom: 1px solid var(--glass-border); }
  .set-row:last-child { border-bottom: none; }
  .set-row .lbl { font-size: 13px; }
  .set-row .sub { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .toggle { width: 42px; height: 24px; border-radius: 999px; background: rgba(255,255,255,0.14); position: relative; cursor: pointer; flex-shrink: 0; transition: background 0.15s; }
  .toggle.on { background: var(--accent); }
  .toggle .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.15s; }
  .toggle.on .knob { left: 21px; }
  .danger { color: var(--down); }

  /* ---------- ADS ---------- */
  .ad-slot { border: 1px dashed rgba(255,255,255,0.22); border-radius: 12px; padding: 10px 12px; margin-top: 10px; position: relative; background: rgba(255,255,255,0.02); }
  .ad-tag { position: absolute; top: -8px; left: 10px; background: #1a1e36; border: 1px solid rgba(255,255,255,0.22); font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); padding: 1px 7px; border-radius: 999px; }
  .ad-copy { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .ad-remove { font-size: 10px; color: var(--accent); margin-top: 6px; cursor: pointer; }
  .plan-chip { font-family: var(--font-mono); font-size: 10px; padding: 5px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); cursor: pointer; }

  /* ---------- BOTTOM NAV ---------- */
  .navbar { flex-shrink: 0; display: flex; background: rgba(10,12,24,0.92); backdrop-filter: blur(14px); border-top: 1px solid var(--glass-border); padding: 10px 6px 16px; }
  .navbtn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--text-dim); font-size: 9.5px; font-family: var(--font-mono); }
  .navbtn.active { color: var(--accent); }
  .navbtn .ic { font-size: 17px; line-height: 1; }

  /* ---------- LOGO MARK ---------- */
  .aa-logo { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .aa-logo svg { display: block; }
  .aa-toggle-hint { font-size: 9px; color: var(--text-dim); }

  @keyframes milo-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes milo-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.12); } }
  @keyframes milo-steam { 0% { transform: translateY(0); opacity: 0.5; } 100% { transform: translateY(-8px); opacity: 0; } }
  .milo-bob-grp { animation: milo-bob 2.6s ease-in-out infinite; transform-origin: center; }
  .milo-eye { animation: milo-blink 4.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .milo-eye.r { animation-delay: 0.05s; }
  .milo-steam { animation: milo-steam 2s ease-out infinite; transform-box: fill-box; transform-origin: bottom; }
  .milo-steam.s2 { animation-delay: 0.9s; }

  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #14182c; border: 1px solid var(--glass-border); padding: 10px 16px; border-radius: 10px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 999; max-width: 340px; text-align: center; line-height: 1.4; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>

<div class="lab">
  <div class="kicker">Private preview · not published</div>
  <h1>Access Alerts — clickable prototype</h1>
  <div class="note">Simulated data throughout. Click through Sign In → Watchlist → Stock Detail → Search → Portfolio → Milo → Settings.</div>
</div>

<div class="device">
  <div class="notch"></div>
  <div class="screen" id="screen">
    <!-- rendered by JS -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {

  // ---------- LOGO ----------
  function aaLogoSvg(color, size) {
    color = color || '#34C77B';
    size = size || 26;
    return '<svg width="' + (size*1.9) + '" height="' + size + '" viewBox="0 0 190 100" fill="none">' +
      '<path d="M14 50 L64 14 M14 50 L64 86 M40 50 L60 50" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M78 12 L104 88 M108 12 L82 88" stroke="' + color + '" stroke-width="9" stroke-linecap="round"/>' +
      '<path d="M176 50 L126 14 M176 50 L126 86 M150 50 L130 50" stroke="' + color + '" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';
  }

  // ---------- STATE ----------
  var state = {
    screen: 'signin',
    authMode: 'signin',
    detailSym: 'AAPL',
    timeframe: '1D',
    plan: 'basic',
    alertsTab: 'active',
    showNewAlert: false,
    newAlert: { type: 'price', priceMode: 'target', direction: 'above', pctDirection: 'up', extHours: true },
    logoColor: '#34C77B',
    milo: [
      { who: 'bot', text: "Hey, I'm Milo — your stock buddy. Ask me to explain a term, a filing, or what's moving in your portfolio." }
    ],
    paperSym: 'AAPL',
    paperOrder: { type: 'market', tif: 'day', extHours: false },
    paper: { startingCapital: 250000, cash: 250000, holdings: {}, orders: [], history: [] }
  };

  var tickers = {
    AAPL: { name: 'Apple Inc', price: 235.59, base: 235.59, chg: -0.32, pct: -0.14 },
    MSFT: { name: 'Microsoft Corp', price: 513.23, base: 513.23, chg: -0.70, pct: -0.14 },
    NVDA: { name: 'Nvidia Corp', price: 127.89, base: 127.89, chg: -0.04, pct: -0.03 },
    TSLA: { name: 'Tesla Inc', price: 339.73, base: 339.73, chg: -0.27, pct: -0.08 },
    AMZN: { name: 'Amazon.com Inc', price: 226.28, base: 226.28, chg: 0.24, pct: 0.11 },
    GOOGL: { name: 'Alphabet Inc', price: 200.49, base: 200.49, chg: 0.04, pct: 0.02 },
    META: { name: 'Meta Platforms', price: 739.56, base: 739.56, chg: 0.31, pct: 0.04 }
  };

  var watchlistSyms = ['AAPL', 'TSLA', 'NVDA', 'MSFT'];
  var holdings = [
    { sym: 'AAPL', shares: 20 },
    { sym: 'TSLA', shares: 10 },
    { sym: 'NVDA', shares: 15 }
  ];
  var trending = ['NVDA', 'TSLA', 'META', 'AAPL'];
  var recent = ['MSFT', 'AMZN', 'GOOGL'];

  var alertIdSeq = 8;
  var alerts = [
    { id: 1, sym: 'AAPL', type: 'price', cond: 'Last at or above $238.00', status: 'active', extHours: true },
    { id: 2, sym: 'TSLA', type: 'price', cond: 'Last at or below $330.00', status: 'active', extHours: false },
    { id: 3, sym: 'NVDA', type: 'volume', cond: 'Unusual volume — 3x average', status: 'active', extHours: true },
    { id: 4, sym: 'TSLA', type: 'news', cond: 'Breaking headline alert', status: 'active', extHours: true },
    { id: 5, sym: 'MSFT', type: 'price', cond: 'Last at or below $495.00', status: 'triggered', extHours: false },
    { id: 6, sym: 'AMZN', type: 'price', cond: 'Last at or above $230.00', status: 'canceled', extHours: false }
  ];
  var alertTypeLabel = { price: 'Price', volume: 'Volume', news: 'News' };

  function alertFireMessage(a) {
    if (a.type === 'price') return a.sym + ' just hit your target — ' + a.cond.charAt(0).toLowerCase() + a.cond.slice(1);
    if (a.type === 'volume') return a.sym + ' — unusual volume just lit up (' + (2.5 + Math.random() * 2).toFixed(1) + 'x average)';
    return a.sym + ' — breaking headline just posted';
  }

  function fireAlert(id) {
    var a = alerts.filter(function (x) { return x.id === id; })[0];
    if (!a || a.status !== 'active') return;
    a.status = 'triggered';
    toast('🔔 ' + alertFireMessage(a), 5500);
    render();
  }

  var paperStartOptions = [10000, 50000, 100000, 250000, 500000];
  var paperQtyOptions = [10, 50, 100, 500];
  var paperOrderIdSeq = 1;
  var paperAlerts = [
    { sym: 'AAPL', text: 'Crossed above your practice target of $235.00' },
    { sym: 'NVDA', text: 'Unusual volume spotted — 2.8x average' },
    { sym: 'TSLA', text: 'Breaking headline just posted' }
  ];

  function paperHoldingsValue() {
    var v = 0;
    Object.keys(state.paper.holdings).forEach(function (s) {
      v += state.paper.holdings[s].shares * tickers[s].price;
    });
    return v;
  }
  function paperEquity() { return state.paper.cash + paperHoldingsValue(); }
  function paperReturnPct() {
    return ((paperEquity() - state.paper.startingCapital) / state.paper.startingCapital) * 100;
  }

  function fillPaperOrder(o) {
    var cost = o.qty * o.price;
    if (o.side === 'buy') {
      if (cost > state.paper.cash) {
        if (o.market) { toast('Not enough paper cash for that'); return false; }
        return false; // limit order stays open, insufficient cash right now
      }
      state.paper.cash -= cost;
      var held = state.paper.holdings[o.sym];
      if (held) {
        var totalShares = held.shares + o.qty;
        held.avgCost = ((held.avgCost * held.shares) + cost) / totalShares;
        held.shares = totalShares;
      } else {
        state.paper.holdings[o.sym] = { shares: o.qty, avgCost: o.price };
      }
      toast((o.market ? 'Bought ' : '🔔 Limit filled — bought ') + o.qty + ' ' + o.sym + ' @ ' + fmt(o.price) + ' (paper)', o.market ? 1800 : 5500);
    } else {
      var h = state.paper.holdings[o.sym];
      if (!h || h.shares < o.qty) {
        if (o.market) { toast('You only own ' + (h ? h.shares : 0) + ' practice shares of ' + o.sym); return false; }
        return false; // limit order stays open, don't own enough right now
      }
      h.shares -= o.qty;
      state.paper.cash += cost;
      if (h.shares === 0) delete state.paper.holdings[o.sym];
      toast((o.market ? 'Sold ' : '🔔 Limit filled — sold ') + o.qty + ' ' + o.sym + ' @ ' + fmt(o.price) + ' (paper)', o.market ? 1800 : 5500);
    }
    state.paper.history.unshift({ time: new Date(), side: o.side, sym: o.sym, qty: o.qty, price: o.price, total: cost, market: o.market });
    render();
    return true;
  }

  function checkPaperOrderFills() {
    if (!state.paper.orders.length) return;
    var stillOpen = [];
    state.paper.orders.forEach(function (o) {
      var price = tickers[o.sym].price;
      var trigger = o.side === 'buy' ? price <= o.limitPrice : price >= o.limitPrice;
      if (trigger && fillPaperOrder({ sym: o.sym, side: o.side, qty: o.qty, price: price, market: false })) {
        return; // filled, drop from open orders
      }
      stillOpen.push(o);
    });
    state.paper.orders = stillOpen;
  }

  function fmt(n) { return (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2); }
  function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }
  function toast(msg, ms) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, ms || 1800);
  }

  function sparkPath(seed, w, h, forceUp) {
    var pts = [], v = 0.5;
    for (var i = 0; i < 16; i++) {
      v += (Math.sin(seed + i * 1.7) * 0.5 + (Math.random() - 0.5) * 0.4);
      pts.push(v);
    }
    var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    var d = pts.map(function (p, i) {
      var x = (i / (pts.length - 1)) * w;
      var y = h - ((p - min) / (max - min || 1)) * h;
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var up = forceUp !== undefined ? forceUp : pts[pts.length - 1] >= pts[0];
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '"><path d="' + d + '" fill="none" stroke="' + (up ? 'var(--up)' : 'var(--down)') + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function candles(seed) {
    var w = 8, gap = 3, price = 100;
    var bars = [];
    for (var i = 0; i < 26; i++) {
      var o = price;
      var c = o + (Math.sin(seed + i) * 3 + (Math.random() - 0.5) * 4);
      var hi = Math.max(o, c) + Math.random() * 2;
      var lo = Math.min(o, c) - Math.random() * 2;
      price = c;
      bars.push({ o: o, c: c, hi: hi, lo: lo });
    }
    var lows = bars.map(function (b) { return b.lo; });
    var highs = bars.map(function (b) { return b.hi; });
    var min = Math.min.apply(null, lows), max = Math.max.apply(null, highs);
    var range = (max - min) || 1;
    var H = 100, pad = 6;
    function y(v) { return pad + (1 - (v - min) / range) * (H - pad * 2); }
    var x = 0, svg = '';
    bars.forEach(function (b) {
      var up = b.c >= b.o;
      var color = up ? 'var(--up)' : 'var(--down)';
      var yO = y(b.o), yC = y(b.c), yH = y(b.hi), yL = y(b.lo);
      svg += '<line x1="' + (x + w/2) + '" y1="' + yH.toFixed(1) + '" x2="' + (x + w/2) + '" y2="' + yL.toFixed(1) + '" stroke="' + color + '" stroke-width="1"/>';
      svg += '<rect x="' + x + '" y="' + Math.min(yO, yC).toFixed(1) + '" width="' + w + '" height="' + Math.max(2, Math.abs(yO - yC)).toFixed(1) + '" fill="' + color + '"/>';
      x += w + gap;
    });
    return '<svg viewBox="0 0 ' + x + ' ' + H + '" width="100%" height="150" preserveAspectRatio="none">' + svg + '</svg>';
  }

                '</div>' +
                (a.status === 'active' ? '<div class="icon-btn" style="width:26px;height:26px;font-size:11px;" onclick="app.cancelAlert(' + a.id + ')">✕</div>' : '<span style="font-size:10px;color:var(--text-dim);text-transform:capitalize;">' + a.status + '</span>') +
              '</div>'
            );
          }).join('') +
        '</div>') +
        (state.showNewAlert ? newAlertForm() : '<button class="btn-primary" style="margin-top:12px;" onclick="app.toggleNewAlertForm()">+ New alert</button>') +
      '</div>'
    );
  }

  var miloReplies = {
    "what does p/e mean": "P/E, or price-to-earnings, is a stock's price divided by its earnings per share. A higher P/E usually means investors expect faster growth — but it also means you're paying more per dollar of current earnings.",
    "how is my portfolio doing": "Right now your simulated portfolio is weighted toward AAPL, TSLA, and NVDA. In a live build I'd pull your real positions and give you today's move, not just a snapshot.",
    "explain a 10-k": "A 10-K is a company's annual report filed with the SEC — audited financials, risk factors, and management's discussion of the business. It's the most complete official picture of a company you'll find."
  };
  function miloCharacterSvg() {
    return (
      '<svg width="120" height="96" viewBox="0 0 120 96" fill="none">' +
        // desk
        '<rect x="8" y="70" width="104" height="6" rx="2" fill="rgba(255,255,255,0.12)"/>' +
        '<rect x="14" y="76" width="6" height="16" fill="rgba(255,255,255,0.1)"/>' +
        '<rect x="100" y="76" width="6" height="16" fill="rgba(255,255,255,0.1)"/>' +
        // laptop
        '<rect x="42" y="54" width="36" height="22" rx="3" fill="#1a1e36" stroke="rgba(255,255,255,0.18)"/>' +
        '<rect x="44" y="56" width="32" height="14" rx="1.5" fill="#0a0d1c"/>' +
        '<rect x="40" y="75" width="40" height="4" rx="1.5" fill="#20243c"/>' +
        // coffee cup
        '<rect x="90" y="60" width="12" height="12" rx="2" fill="#2a1f14" stroke="rgba(255,255,255,0.15)"/>' +
        '<path d="M102 63 q6 0 6 4.5 t-6 4.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>' +
        '<path class="milo-steam" d="M93 58 q1.5 -3 0 -5" stroke="rgba(255,255,255,0.35)" stroke-width="1.3" fill="none" stroke-linecap="round"/>' +
        '<path class="milo-steam s2" d="M96 58 q1.5 -3 0 -5" stroke="rgba(255,255,255,0.25)" stroke-width="1.3" fill="none" stroke-linecap="round"/>' +
        // Milo body (star/blob), bobbing gently
        '<g transform="translate(60,32)">' +
          '<g class="milo-bob-grp">' +
            '<path d="M0 -26 L7 -8 L26 -7 L10 5 L16 24 L0 12 L-16 24 L-10 5 L-26 -7 L-7 -8 Z" fill="#34C77B" opacity="0.92"/>' +
            '<circle class="milo-eye" cx="-7" cy="-2" r="2.6" fill="#06180F"/>' +
            '<circle class="milo-eye r" cx="7" cy="-2" r="2.6" fill="#06180F"/>' +
            '<path d="M-6 6 Q0 11 6 6" stroke="#06180F" stroke-width="2" fill="none" stroke-linecap="round"/>' +
          '</g>' +
        '</g>' +
      '</svg>'
    );
  }

  function trendingTodayList() {
    var syms = Object.keys(tickers).slice().sort(function (a, b) { return tickers[b].pct - tickers[a].pct; });
    return (
      '<div class="glass" style="margin-top:12px;">' +
        '<div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">Trending today <span style="opacity:.6;">(simulated)</span></div>' +
        syms.map(function (s, i) {
          return '<div class="row" onclick="app.openDetail(\'' + s + '\')"><div><span style="color:var(--text-dim);font-family:var(--font-mono);font-size:10px;margin-right:6px;">' + (i + 1) + '</span><span class="tick">' + s + '</span></div>' + sparkPath(s.length + i, 44, 18, tickers[s].pct >= 0) + '</div>';
        }).join('') +
      '</div>'
    );
  }

  function miloMoodLine() {
    var syms = Object.keys(tickers);
    var upCount = syms.filter(function (s) { return tickers[s].pct >= 0; }).length;
    var downCount = syms.length - upCount;
    var leader = syms.slice().sort(function (a, b) { return Math.abs(tickers[b].pct) - Math.abs(tickers[a].pct); })[0];
    var leaderTxt = leader + ' is moving the most right now.';
    if (upCount === downCount) return 'Pretty even out there today, a mix of both directions. ' + leaderTxt;
    if (upCount > downCount) return 'More green than red on your list this morning. ' + leaderTxt;
    return 'A bit more red than green out there right now. ' + leaderTxt;
  }

  function miloGreeting() {
    var h = new Date().getHours();
    if (h >= 5 && h < 11) return { head: 'Good morning!', sub: 'Here\'s what\'s trending right now — grab a cup of coffee and have a nice day.' };
    if (h >= 11 && h < 14) return { head: 'Good afternoon.', sub: 'Here\'s what\'s trending as of right now, in case you\'re between meetings — or lunch.' };
    if (h >= 14 && h < 17) return { head: 'Still watching the tape?', sub: 'Here\'s what\'s trending at this hour.' };
    if (h >= 17 && h < 21) return { head: 'Good evening.', sub: 'Markets are winding down — here\'s where things stand right now.' };
    if (h >= 21 || h < 1) return { head: 'Up late?', sub: 'Here\'s what\'s moving right now, if you\'re still keeping an eye on it.' };
    return { head: 'Hey — burning the midnight oil?', sub: 'Here\'s what\'s going on right now, quiet hours or not.' };
  }

  function screenMilo() {
    var greet = miloGreeting();
    return (
      topbar('Milo') +
      '<div class="content" style="padding-bottom:16px;display:flex;flex-direction:column;">' +
        '<div style="flex:1;">' +
          '<div class="glass" style="text-align:center;padding:16px 12px;">' +
            miloCharacterSvg() +
            '<div style="font-family:var(--font-display);font-size:15px;font-weight:600;margin-top:4px;">' + greet.head + '</div>' +
            '<div style="font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.5;">' + greet.sub + '</div>' +
          '</div>' +
          '<div class="milo-msg bot" style="margin-top:12px;">' + miloMoodLine() + '</div>' +
          trendingTodayList() +
          '<div style="height:14px;"></div>' +
          state.milo.map(function (m) {
            return '<div class="milo-msg ' + (m.who === 'me' ? 'me' : 'bot') + '">' + m.text + '</div>';
          }).join('') +
          '<div class="milo-suggest">' +
            Object.keys(miloReplies).map(function (q) {
              return '<span onclick="app.askMilo(\'' + q + '\')">' + q + '</span>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="milo-input-row">' +
        '<input id="milo-in" placeholder="Ask Milo about a term, a filing, your portfolio…" onkeydown="if(event.key===\'Enter\')app.sendMilo()">' +
        '<button class="milo-send" onclick="app.sendMilo()">→</button>' +
      '</div>'
    );
  }

  function toggleRow(label, sub, on, key) {
    return (
      '<div class="set-row">' +
        '<div><div class="lbl">' + label + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' +
        '<div class="toggle' + (on ? ' on' : '') + '" onclick="app.toggleSetting(\'' + key + '\')"><div class="knob"></div></div>' +
      '</div>'
    );
  }
  var settings = { priceAlerts: true, dailySummary: false, pushNotifications: true };
  function screenSettings() {
    return (
      topbar('Settings') +
      '<div class="content">' +
        '<div class="section-label">Plan <span style="opacity:.6;">(tap to preview)</span></div>' +
        '<div class="glass" style="display:flex;align-items:center;justify-content:space-between;">' +
          '<div><div class="lbl" style="text-transform:capitalize;">' + state.plan + '</div><div class="sub">' + (state.plan === 'basic' ? 'Ads shown on Watchlist & Search' : 'Ad-free') + '</div></div>' +
          '<div class="plan-chip" onclick="app.cyclePlan()">Switch plan ↻</div>' +
        '</div>' +
        '<div class="section-label">Account</div>' +
        '<div class="glass">' +
          '<div class="row"><span class="lbl">Account Details</span><span style="color:var(--text-dim);">›</span></div>' +
          '<div class="row"><span class="lbl">Currency</span><span style="color:var(--text-dim);">USD ›</span></div>' +
          '<div class="row"><span class="lbl">Theme</span><span style="color:var(--text-dim);">Dark ›</span></div>' +
          '<div class="row"><span class="lbl">Language</span><span style="color:var(--text-dim);">English ›</span></div>' +
        '</div>' +
        '<div class="section-label">Learn</div>' +
        '<div class="glass">' +
          '<div class="row" onclick="app.go(\'paper\')"><span class="lbl">🎓 Paper Trading (practice account)</span><span style="color:var(--text-dim);">›</span></div>' +
        '</div>' +
        '<div class="section-label">Notifications</div>' +
        '<div class="glass">' +
          toggleRow('Price Alerts', 'Push + in-app', settings.priceAlerts, 'priceAlerts') +
          toggleRow('Push Notifications', 'Required for price alerts to arrive', settings.pushNotifications, 'pushNotifications') +
          toggleRow('Daily Summary Emails', 'One recap each evening', settings.dailySummary, 'dailySummary') +
        '</div>' +
        '<div class="section-label">Feedback</div>' +
        '<div class="glass">' +
          '<div style="font-size:11.5px;color:var(--text-dim);line-height:1.6;margin-bottom:10px;">See something missing, or an idea for a feature? Tell us — if enough people ask for the same thing, we build it and let everyone know.</div>' +
          '<div class="field"><label>Your suggestion</label><textarea id="feedback-text" rows="3" placeholder="e.g. I\'d love a way to..." style="width:100%;background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-family:var(--font-body);font-size:13px;padding:10px 12px;resize:vertical;"></textarea></div>' +
          '<button class="btn-primary" style="margin-top:0;" onclick="app.submitFeedback()">Send suggestion</button>' +
        '</div>' +
        '<div class="section-label">Danger zone</div>' +
        '<div class="glass">' +
          '<div class="row" onclick="app.toast(\'Preview only — cache not actually cleared.\')"><span class="lbl">Clear Cache</span><span style="color:var(--text-dim);">›</span></div>' +
          '<div class="row" onclick="app.toast(\'Preview only — nothing is deleted here.\')"><span class="lbl danger">Delete Account</span><span style="color:var(--down);">›</span></div>' +
        '</div>' +
      '</div>'
    );
  }

  function topbar(title, back) {
    return (
      '<div class="demo-banner">Private preview · simulated data · not connected to a brokerage</div>' +
      '<div class="topbar">' +
        '<div class="brand">' +
          (back ? '<div class="icon-btn" onclick="app.go(\'watchlist\')">←</div>' : '<div class="aa-logo" onclick="app.cycleLogo()">' + aaLogoSvg(state.logoColor, 16) + '</div>') +
          '<span class="name">' + title + '</span>' +
        '</div>' +
        '<div class="icon-btn" onclick="app.go(\'alerts\')">🔔</div>' +
      '</div>'
    );
  }

  var screens = {
    signin: screenSignIn,
    watchlist: screenWatchlist,
    detail: screenDetail,
    search: screenSearch,
    portfolio: screenPortfolio,
    milo: screenMilo,
    settings: screenSettings,
    alerts: screenAlerts,
    paper: screenPaperTrading
  };

  var navItems = [
    { key: 'watchlist', ic: '☰', label: 'Watch' },
    { key: 'search', ic: '⌕', label: 'Search' },
    { key: 'portfolio', ic: '◔', label: 'Portfolio' },
    { key: 'milo', ic: '✦', label: 'Milo' },
    { key: 'settings', ic: '⚙', label: 'Settings' }
  ];

  function render(preserveScroll) {
    var root = document.getElementById('screen');
    var prevContent = root.querySelector('.content');
    var scrollTop = (preserveScroll !== false && prevContent) ? prevContent.scrollTop : 0;

    // if the user is mid-typing in a text field when a background tick fires
    // (live prices, an alert firing, an order filling), don't yank the field
    // out from under them — capture it and restore focus/value/cursor after.
    var active = document.activeElement;
    var focusInfo = null;
    if (active && active.id && root.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
      focusInfo = { id: active.id, value: active.value, selStart: active.selectionStart, selEnd: active.selectionEnd };
    }

    var html = screens[state.screen]();
    var showNav = state.screen !== 'signin';
    if (showNav) {
      var activeKey = (state.screen === 'detail' || state.screen === 'alerts' || state.screen === 'paper') ? 'watchlist' : state.screen;
      html += '<div class="navbar">' + navItems.map(function (n) {
        return '<div class="navbtn' + (n.key === activeKey ? ' active' : '') + '" onclick="app.go(\'' + n.key + '\')"><div class="ic">' + n.ic + '</div>' + n.label + '</div>';
      }).join('') + '</div>';
    }
    root.innerHTML = html;
    if (scrollTop) {
      var newContent = root.querySelector('.content');
      if (newContent) newContent.scrollTop = scrollTop;
    }
    if (focusInfo) {
      var el = document.getElementById(focusInfo.id);
      if (el) {
        el.value = focusInfo.value;
        el.focus();
        if (el.setSelectionRange) {
          try { el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); } catch (e) {}
        }
      }
    }
  }

  // ---------- LIVE SIM ----------
  setInterval(function () {
    Object.keys(tickers).forEach(function (sym) {
      var t = tickers[sym];
      var move = (Math.random() - 0.5) * 0.6;
      t.price = Math.max(1, t.price + move);
      t.chg = t.price - t.base;
      t.pct = (t.chg / t.base) * 100;
    });
    checkPaperOrderFills();
    if (['watchlist','detail','portfolio','search','paper'].indexOf(state.screen) !== -1) render();
  }, 2200);

  // ambient alert firing — simulates Milo catching something in the background,
  // even on screens the user isn't currently looking at (matches push-notification behavior)
  function scheduleNextFire() {
    var delay = 18000 + Math.random() * 20000; // ~18-38s
    setTimeout(function () {
      var activeOnes = alerts.filter(function (a) { return a.status === 'active'; });
      if (activeOnes.length) fireAlert(activeOnes[Math.floor(Math.random() * activeOnes.length)].id);
      scheduleNextFire();
    }, delay);
  }
  scheduleNextFire();

  // ---------- PUBLIC API ----------
  window.app = {
    go: function (s) { state.screen = s; render(false); },
    toggleAuth: function () { state.authMode = state.authMode === 'signin' ? 'signup' : 'signin'; render(); },
    openDetail: function (sym) { state.detailSym = sym; state.screen = 'detail'; state.timeframe = '1D'; render(false); },
    setTf: function (tf) { state.timeframe = tf; render(); },
    toggleSetting: function (key) {
      settings[key] = !settings[key];
      if (key === 'priceAlerts' && !settings[key]) settings.pushNotifications = false;
      render();
    },
    askMilo: function (q) {
      state.milo.push({ who: 'me', text: q });
      state.milo.push({ who: 'bot', text: miloReplies[q] });
      render();
    },
    sendMilo: function () {
      var input = document.getElementById('milo-in');
      var v = input.value.trim();
      if (!v) return;
      state.milo.push({ who: 'me', text: v });
      state.milo.push({ who: 'bot', text: "In this preview I only know a few canned answers — in the real build I'll be reading live SEC filings and your actual portfolio to answer anything." });
      render();
    },
    cycleLogo: function () {
      state.logoColor = state.logoColor === '#34C77B' ? '#FF6B6B' : '#34C77B';
      render();
    },
    cyclePlan: function () {
      var order = ['basic', 'plus', 'pro'];
      state.plan = order[(order.indexOf(state.plan) + 1) % order.length];
      toast('Previewing ' + state.plan + ' plan');
      render();
    },
    setAlertsTab: function (t) { state.alertsTab = t; render(); },
    toggleNewAlertForm: function () {
      state.showNewAlert = !state.showNewAlert;
      if (state.showNewAlert) state.newAlert = { type: 'price', priceMode: 'target', direction: 'above', pctDirection: 'up', extHours: true };
      render();
    },
    setNewAlertType: function (t) { state.newAlert.type = t; render(); },
    setNewAlertPriceMode: function (m) { state.newAlert.priceMode = m; render(); },
    setNewAlertDirection: function (d) { state.newAlert.direction = d; render(); },
    setNewAlertPctDirection: function (d) { state.newAlert.pctDirection = d; render(); },
    toggleNewAlertExtHours: function () { state.newAlert.extHours = !state.newAlert.extHours; render(); },
    cancelAlert: function (id) {
      var a = alerts.filter(function (x) { return x.id === id; })[0];
      if (a) { a.status = 'canceled'; toast(a.sym + ' alert canceled'); render(); }
    },
    simulateFire: function () {
      var activeOnes = alerts.filter(function (a) { return a.status === 'active'; });
      if (!activeOnes.length) { toast('No active alerts to trigger — add one first'); return; }
      fireAlert(activeOnes[Math.floor(Math.random() * activeOnes.length)].id);
    },
    saveNewAlert: function () {
      var sym = document.getElementById('na-sym').value;
      var na = state.newAlert;
      var cond;
      if (na.type === 'price' && na.priceMode === 'percent') {
        var pct = parseFloat(document.getElementById('na-value').value);
        if (!pct || pct <= 0) { toast('Enter a percent first'); return; }
        cond = (na.pctDirection === 'up' ? 'Up' : 'Down') + ' ' + pct.toFixed(1) + '% from previous close';
      } else if (na.type === 'price') {
        var val = parseFloat(document.getElementById('na-value').value);
        if (!val || val <= 0) { toast('Enter a price first'); return; }
        cond = 'Last at or ' + na.direction + ' ' + fmt(val);
      } else if (na.type === 'volume') {
        cond = 'Unusual volume — 3x average';
      } else {
        cond = 'Breaking headline alert';
      }
      alerts.unshift({ id: alertIdSeq++, sym: sym, type: na.type, cond: cond, status: 'active', extHours: na.extHours });
      state.showNewAlert = false;
      state.alertsTab = 'active';
      toast(sym + ' alert set');
      render();
    },
    toast: toast,
    submitFeedback: function () {
      var input = document.getElementById('feedback-text');
      var text = input ? input.value.trim() : '';
      if (!text) { toast('Type a suggestion first'); return; }
      input.value = '';
      toast('Thanks — every suggestion gets read. We\'ll notify you if we build it.', 4000);
    },
    setPaperSym: function (s) { state.paperSym = s; render(); },
    setPaperOrderType: function (t) { state.paperOrder.type = t; render(); },
    quickFillPaperQty: function (q) {
      var input = document.getElementById('paper-qty');
      if (input) {
        var current = parseInt(input.value, 10) || 0;
        input.value = current + q;
        input.focus();
      }
    },
    clearPaperQty: function () {
      var input = document.getElementById('paper-qty');
      if (input) { input.value = ''; input.focus(); }
    },
    setPaperOrderTif: function (t) { state.paperOrder.tif = t; render(); },
    togglePaperOrderExtHours: function () { state.paperOrder.extHours = !state.paperOrder.extHours; render(); },
    resetPaperAccount: function (amt) {
      state.paper = { startingCapital: amt, cash: amt, holdings: {}, orders: [], history: [] };
      toast('Practice account reset to ' + fmt(amt));
      render();
    },
    cancelPaperOrder: function (id) {
      state.paper.orders = state.paper.orders.filter(function (o) { return o.id !== id; });
      toast('Order canceled');
      render();
    },
    paperBuy: function () { app.submitPaperOrder('buy'); },
    paperSell: function () { app.submitPaperOrder('sell'); },
    submitPaperOrder: function (side) {
      var sym = state.paperSym;
      var qty = parseInt(document.getElementById('paper-qty').value, 10);
      if (!qty || qty <= 0) { toast('Enter a quantity first'); return; }

      if (state.paperOrder.type === 'market') {
        fillPaperOrder({ sym: sym, side: side, qty: qty, price: tickers[sym].price, market: true });
        return;
      }

      var limitPrice = parseFloat(document.getElementById('paper-limit-price').value);
      if (!limitPrice || limitPrice <= 0) { toast('Enter a limit price first'); return; }
      var order = {
        id: paperOrderIdSeq++, sym: sym, side: side, qty: qty, limitPrice: limitPrice,
        tif: state.paperOrder.tif, extHours: state.paperOrder.extHours
      };
      state.paper.orders.push(order);
      toast((side === 'buy' ? 'Buy' : 'Sell') + ' limit placed: ' + qty + ' ' + sym + ' @ ' + fmt(limitPrice) + ' (' + order.tif.toUpperCase() + ')');
      render();
    }
  };

  render();
})();
</script>
</body>
</html>
